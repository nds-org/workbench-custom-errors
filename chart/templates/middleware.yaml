apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.config.redirectToLogin.name }}
spec:
  errors:
    query: /401.html
    service:
      name: {{ .Release.Name }}
      port: 80
    status:
    - "401"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.config.privateAuth.name }}
spec:
  forwardAuth:
    address: {{ .Values.config.privateAuth.forwardAddress }}
