{{- if .Values.config.corsHeader.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.config.corsHeader.name }}
spec:
  headers:
    accessControlAllowCredentials: true
    accessControlAllowHeaders:
    - Origin
    - X-Requested-With
    - X-Retry-In
    - Retry-After
    - Content-Type
    - content-type
    - Accept
    - Authorization
    accessControlAllowMethods:
    - GET
    - OPTIONS
    - PUT
    - DELETE
    - POST
    - PATCH
    accessControlAllowOriginList:
    - '{{ .Values.config.corsHeader.allowedOrigins }}'
    accessControlExposeHeaders:
    - X-Retry-In
    - Retry-After
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.config.redirectToLogin.name }}
spec:
  errors:
    query: /401.html
    service:
      name: {{ .Release.Name }}
      port: 80
    status:
    - "401"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.config.privateAuth.name }}
spec:
  forwardAuth:
    address: {{ .Values.config.privateAuth.forwardAddress }}
